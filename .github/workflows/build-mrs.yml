
name: Build Mihomo MRS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-mrs.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

concurrency:
  group: build-custom-rules-mrs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download custom_rules.list
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/armin19900/sing-box-rules/refs/heads/main/reF1nd.json" \
            -o custom_rules.list

          test -s custom_rules.list

      - name: Download Mihomo
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          URL="$(curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name | test("^mihomo-linux-amd64-v[0-9]+\\.[0-9]+\\.[0-9]+\\.gz$"))
              | .browser_download_url' |
            head -n 1)"

          if [ -z "$URL" ]; then
            echo "Cannot find Mihomo Linux amd64 release"
            exit 1
          fi

          curl -fL --retry 3 "$URL" -o mihomo.gz
          gzip -df mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Compile MRS
        run: |
          set -euo pipefail
          ./mihomo convert-ruleset domain text \
            custom_rules.list custom_rules.mrs
          test -s custom_rules.mrs

      - name: Publish to release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir publish
          cp custom_rules.mrs publish/
          cp custom_rules.list publish/

          cd publish
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_rules.mrs custom_rules.list
          git commit -m "Update custom rules MRS"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin release

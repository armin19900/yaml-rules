
name: Build custom_rules.mrs

on:
  push:
    branches:
      - main
    paths:
      - "custom_rules.list"
      - ".github/workflows/build-mrs.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

concurrency:
  group: build-custom-rules-mrs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl jq git gzip


      - name: Download Mihomo
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          curl -fsSL "$API" -o release.json

          URL="$(jq -r '
            [.assets[]
              | select(.name | test("^mihomo-linux-amd64.*\\.gz$"))
              | select(.name | contains("compatible") | not)
              | .browser_download_url][0] // empty
          ' release.json)"

          if [ -z "$URL" ]; then
            echo "没有找到 Mihomo Linux amd64 下载包"
            jq -r '.assets[].name' release.json
            exit 1
          fi

          echo "Downloading: $URL"
          curl -fL --retry 3 "$URL" -o mihomo.gz

          gzip -t mihomo.gz
          gzip -df mihomo.gz
          chmod +x mihomo
          ./mihomo -v


      - name: Compile MRS
        run: |
          set -euo pipefail
          ./mihomo convert-ruleset domain text \
            custom_rules.list custom_rules.mrs
          test -s custom_rules.mrs

      - name: Publish to release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir publish
          cp custom_rules.mrs publish/
          cp custom_rules.list publish/

          cd publish
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_rules.mrs custom_rules.list
          git commit -m "Update custom rules MRS"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin release
